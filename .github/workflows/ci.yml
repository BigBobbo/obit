name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The moderation decision table is the product: Tier 0's hard blocks, the
      # Tier 2 routing matrix, and the page-reference validation that keeps
      # memorial pages unenumerable. These run without a database.
      - name: Test
        run: npm test

      # Build with placeholder public env vars. The app reads real secrets at
      # runtime and degrades gracefully when integrations are unconfigured, so
      # a keyless build is a genuine compile + type check of every route.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
