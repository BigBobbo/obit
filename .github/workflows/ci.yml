name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The moderation decision table is the product: Tier 0's hard blocks, the
      # Tier 2 routing matrix, and the page-reference validation that keeps
      # memorial pages unenumerable. These run without a database.
      - name: Test
        run: npm test

      # Build with placeholder public env vars. The app reads real secrets at
      # runtime and degrades gracefully when integrations are unconfigured, so
      # a keyless build is a genuine compile + type check of every route.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # The migrations are applied to a real Postgres, in order. A syntax check
  # cannot catch what this catches: a `language sql` function body is parsed and
  # validated at CREATE time, so referencing a table the same file creates
  # further down fails only at apply time. That is how is_steward() shipped
  # broken and stayed broken until someone ran it by hand.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations and assert the schema
        run: supabase/tests/apply-migrations.sh
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
